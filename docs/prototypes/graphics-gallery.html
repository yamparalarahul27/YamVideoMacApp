<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphics Gallery</title>
<!-- Mock-up of the Studio's Graphics gallery (docs/plans/graphics-gallery.md). The Glass and
     Ink previews are real renders of the graphics engine over a neutral backdrop; the Paper look
     and the Pills kind are drawn here as proposals. No footage. -->
<style>
  @font-face { font-family: "Virgil"; src: url("../../Resources/Graphics/fonts/Virgil.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../Resources/Graphics/fonts/Inter-400-latin.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("../../Resources/Graphics/fonts/Inter-700-latin.woff2") format("woff2"); }
  :root { --bg: #1e1f22; --panel: #26272b; --line: #34363b; --text: #e8e8ea; --muted: #9a9ca3; --accent: #D962C0; --sel: #3a6ff7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111214; color: var(--text); font: 13px/1.35 -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; }
  .window { margin: 18px auto; width: 1360px; max-width: calc(100vw - 32px); height: 820px; background: var(--bg);
    border: 1px solid #000; border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: 44px 1fr; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .titlebar { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #2a2b30; border-bottom: 1px solid #000; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #4a4c52; }
  .titlebar .name { margin-left: 14px; color: var(--muted); }
  .main { display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
  .left { background: var(--panel); border-right: 1px solid #000; display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .tab { padding: 10px 0 8px; text-align: center; color: var(--muted); font-size: 12px; }
  .tab b { display: block; font-size: 16px; margin-bottom: 2px; }
  .tab.on { color: #fff; box-shadow: inset 0 -2px 0 var(--sel); }
  .controls { padding: 10px 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { width: 52px; color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; background: #1b1c1f; border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
  .seg button { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 5px; color: var(--muted); font-size: 12px; }
  .seg button.on { background: #44464d; color: #fff; }
  .new { font-size: 9px; font-weight: 700; letter-spacing: .06em; color: #111; background: #f3c34b; border-radius: 4px; padding: 1px 4px; margin-left: 4px; vertical-align: 1px; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid #fff3; }
  .search { flex: 1; background: #1b1c1f; border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; color: var(--muted); }
  .list { overflow: auto; padding: 4px 12px 16px; }
  .group { margin: 12px 0 6px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: #1b1c1f; overflow: hidden; position: relative; }
  .tile.on { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
  .tile .pic { aspect-ratio: 16 / 9; position: relative; overflow: hidden; background: #000; }
  .tile .pic > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .meta { padding: 6px 8px 8px; }
  .tile .t { font-weight: 600; font-size: 12px; }
  .tile .d { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .add { position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: #000a; color: #fff;
    display: grid; place-items: center; font-size: 15px; opacity: 0; transition: opacity .15s; }
  .tile:hover .add { opacity: 1; }
  .right { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  .stage { padding: 24px; display: grid; place-items: center; min-height: 0; }
  .frame { width: min(100%, 900px); aspect-ratio: 16 / 9; position: relative; overflow: hidden; border-radius: 6px; background: #000; box-shadow: 0 10px 40px #0008; }
  .frame > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid #000; background: #232428; }
  .bar .what { font-weight: 600; }
  .bar .help { color: var(--muted); flex: 1; }
  .btn { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 7px; background: var(--sel); color: #fff; font-weight: 600; }
  .btn.ghost { background: #3a3b40; }

  /* Proposal: the Paper look, drawn on a 1920x1080 stage that scales to its box. */
  .stage1920 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .paper { position: absolute; left: 1080px; top: 90px; width: 720px; padding: 64px 64px 70px; background: #f7f2e7; border-radius: 26px;
    box-shadow: 0 30px 70px rgba(0,0,0,.45); transform: rotate(-1.2deg); color: #2a211b; }
  .paper .tape { position: absolute; left: 50%; top: -26px; width: 190px; height: 52px; margin-left: -95px; background: rgba(244, 196, 64, .86);
    transform: rotate(-3deg); clip-path: polygon(3% 8%, 97% 0, 100% 92%, 2% 100%, 0 52%); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .paper .eyebrow { font: 800 30px/1 "Inter", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #d4542a; margin-bottom: 22px; }
  .paper .big { font: 900 118px/0.95 "New York", "Iowan Old Style", Georgia, serif; letter-spacing: -0.02em; }
  .paper .big2 { font: italic 800 78px/1.05 "New York", "Iowan Old Style", Georgia, serif; margin-top: 6px; }
  .label { position: absolute; left: 1120px; top: 560px; padding: 20px 40px 24px; background: #e2622e; color: #fff; border-radius: 12px;
    font: 54px/1 "Virgil", "Marker Felt", cursive; transform: rotate(-3.5deg); box-shadow: 0 18px 40px rgba(0,0,0,.4); }
  .paper.np { top: 120px; width: 640px; padding: 48px 54px 54px; }
  .paper.np .big { font-size: 80px; }
  .paper.np .eyebrow { font-size: 24px; }
  .paper.sec { left: 460px; top: 340px; width: 1000px; text-align: center; transform: rotate(-0.6deg); }

  /* Proposal: Pills, flat colour chips with a bold icon. */
  .pills { position: absolute; left: 1010px; top: 120px; width: 820px; display: flex; flex-wrap: wrap; gap: 26px; }
  .pill { display: inline-flex; align-items: center; gap: 22px; height: 132px; padding: 0 52px 0 40px; border-radius: 999px;
    font: 700 60px/1 "Inter", sans-serif; letter-spacing: -0.01em; box-shadow: 0 14px 30px rgba(0,0,0,.3); }
  .pill svg { width: 58px; height: 58px; }
  .p1 { background: #24461d; color: #fff; } .p2 { background: #405263; color: #fff; } .p3 { background: #f4a63c; color: #fff; }
  .p4 { background: #fbc3cc; color: #a8233f; } .p5 { background: #fcd03a; color: #6a4a07; } .p6 { background: #9ab9e2; color: #273f55; }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="name">Tradl-AI-First-Impression · Studio</span></div>
  <div class="main">
    <div class="left">
      <div class="tabs">
        <div class="tab"><b>▣</b>Media</div><div class="tab on"><b>Aa</b>Graphics</div><div class="tab"><b>◎</b>Logos</div><div class="tab"><b>✦</b>Effects</div>
      </div>
      <div class="controls">
        <div class="row"><label>Look</label>
          <div class="seg" id="looks"><button data-look="glass" class="on">Glass</button><button data-look="ink">Ink</button><button data-look="paper">Paper<span class="new">NEW</span></button></div>
          <span style="flex:1"></span><span class="swatch" title="Accent: #D962C0"></span>
        </div>
        <div class="row"><input class="search" placeholder="Search graphics" disabled></div>
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="right">
      <div class="stage"><div class="frame" id="frame"></div></div>
      <div class="bar"><span class="what" id="what"></span><span class="help" id="help"></span>
        <button class="btn ghost">Replace selected</button><button class="btn">Add at playhead</button></div>
    </div>
  </div>
</div>
<script>
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2L4 14h6.5L9 22l11-13h-6.8z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.4 2.5h1.8c.8-1.3 2.3-2.5 4.4-2.5 3.7 0 5.9 3.7 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>',
  leaf: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 3C9 3 4 9 4 16c0 1.6.4 3 1 4l1.6-1.6C9 12 13 9 18 7c-4 3-7.5 6.5-9.6 11.6C17 19 21 12 20 3z"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l9-4 9 4v10l-9 4-9-4z" opacity=".35"/><path d="M12 11L3 7v10l9 4z"/></svg>',
};
// The Glass and Ink pictures are renders of the real engine; Paper and Pills are drawn below.
const PAPER = {
  titleCard: '<div class="paper"><div class="tape"></div><div class="eyebrow">Feedback 1</div><div class="big">Use the space</div><div class="big2">a wider strategy panel</div></div>',
  namePlate: '<div class="paper np"><div class="tape"></div><div class="eyebrow">UX Design Engineer</div><div class="big">Yamparala Rahul</div></div>',
  sectionCard: '<div class="paper sec"><div class="tape"></div><div class="eyebrow">Part 3</div><div class="big">Backtest results</div></div>',
  callout: '<div class="paper"><div class="tape"></div><div class="eyebrow">The best feature</div><div class="big">Codex</div><div class="big2">Computer Use</div></div><div class="label">most powerful feature</div>',
};
const PILLS = '<div class="pills">'
  + '<span class="pill p1">' + ICON.check + 'Empty state</span><span class="pill p2">' + ICON.chart + 'Backtest</span>'
  + '<span class="pill p3">' + ICON.bolt + 'Fast</span><span class="pill p4">' + ICON.heart + 'Loved it</span>'
  + '<span class="pill p5">' + ICON.leaf + 'Simple</span><span class="pill p6">' + ICON.box + 'Share card</span></div>';
const KINDS = [
  { group: "Cards", id: "namePlate", t: "Name plate", d: "Your name, beside you", paper: true },
  { group: "Cards", id: "titleCard", t: "Title card", d: "A title and one line", paper: true },
  { group: "Cards", id: "featureList", t: "Feature list", d: "Two to four rows" },
  { group: "Cards", id: "callout", t: "Paper callout", d: "Card, tape and a label", paperOnly: true, isNew: true },
  { group: "Full screen", id: "kineticText", t: "Kinetic text", d: "Big words, as said" },
  { group: "Full screen", id: "sectionCard", t: "Section card", d: "A part's title, seek bar", paper: true },
  { group: "Panels", id: "checklist", t: "Checklist", d: "Ticks in the side panel", ink: true },
  { group: "Tags", id: "pills", t: "Pills", d: "Colour chips with icons", drawn: PILLS, isNew: true },
];
let look = "glass", selected = "titleCard";
function scene(k) {
  const paper = (look === "paper" && (k.paper || k.paperOnly)) || k.paperOnly;
  if (k.drawn || paper) {
    return '<img src="graphics-gallery/backdrop.jpg" alt=""><div class="stage1920">' + (k.drawn || PAPER[k.id]) + '</div>';
  }
  return '<img src="graphics-gallery/' + k.id + '.jpg" alt="">';
}
function fit(box) {
  box.querySelectorAll(".stage1920").forEach((s) => { s.style.transform = "scale(" + (box.clientWidth / 1920) + ")"; });
}
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  let group = "";
  let grid;
  KINDS.forEach((k) => {
    if (k.group !== group) {
      group = k.group;
      list.insertAdjacentHTML("beforeend", '<div class="group">' + group + '</div>');
      grid = document.createElement("div"); grid.className = "grid"; list.appendChild(grid);
    }
    const tile = document.createElement("div");
    tile.className = "tile" + (k.id === selected ? " on" : "");
    tile.innerHTML = '<div class="pic">' + scene(k) + '<span class="add">+</span></div><div class="meta"><div class="t">' + k.t
      + (k.isNew ? '<span class="new">NEW</span>' : '') + '</div><div class="d">' + k.d + '</div></div>';
    tile.onclick = () => { selected = k.id; render(); };
    grid.appendChild(tile);
    requestAnimationFrame(() => fit(tile.querySelector(".pic")));
  });
  const k = KINDS.find((x) => x.id === selected);
  const frame = document.getElementById("frame");
  frame.innerHTML = scene(k);
  requestAnimationFrame(() => fit(frame));
  const lookName = k.drawn ? "Pills" : ((look === "paper" && (k.paper || k.paperOnly)) || k.paperOnly) ? "Paper" : k.ink ? "Ink" : "Glass";
  document.getElementById("what").textContent = k.t + " · " + lookName;
  document.getElementById("help").textContent = look === "ink" && !k.ink ? "Ink draws the panel kinds; cards stay glass." : "Click a tile to preview it here. Add puts it at the playhead.";
}
document.querySelectorAll("#looks button").forEach((b) => b.onclick = () => {
  look = b.dataset.look;
  document.querySelectorAll("#looks button").forEach((x) => x.classList.toggle("on", x === b));
  render();
});
window.addEventListener("resize", () => document.querySelectorAll(".pic, #frame").forEach(fit));
render();
</script>
</body>
</html>
